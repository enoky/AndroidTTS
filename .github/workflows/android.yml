name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin:
    name: Kotlin and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android platform 36
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" > /dev/null'
      - name: Compile and run the unit tests
        run: ./gradlew --no-daemon --console=plain testDebugUnitTest compileDebugAndroidTestKotlin

  native:
    name: libptts_ffi.so
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Fetch xn-ptts at the pinned commit
        run: scripts/build-native.sh --fetch-only
      - name: Install Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: build/xn-ptts -> target
      - name: Install cargo-ndk
        run: command -v cargo-ndk || cargo install cargo-ndk --locked
      - name: Build
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          scripts/build-native.sh
      - uses: actions/upload-artifact@v7
        with:
          name: jniLibs
          path: app/src/main/jniLibs
          if-no-files-found: error
          retention-days: 7

  apk:
    name: APK
    needs: [kotlin, native]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android platform 36
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" > /dev/null'
      - uses: actions/download-artifact@v8
        with:
          name: jniLibs
          path: app/src/main/jniLibs
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROIDTTS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROIDTTS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROIDTTS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROIDTTS_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROIDTTS_KEYSTORE_BASE64 secret: the release APK is signed with this run's throwaway debug key, so it will not install over an APK from another run. See README.md, Signing."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "ANDROIDTTS_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "ANDROIDTTS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROIDTTS_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROIDTTS_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build the APKs
        run: |
          ./gradlew --no-daemon --console=plain assembleRelease assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/AndroidTTS-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/AndroidTTS-${GITHUB_RUN_NUMBER}-debug.apk"
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: AndroidTTS-apk
          path: dist/*.apk
          if-no-files-found: error

  # Pushing a tag such as v0.1.0 publishes the APK as a GitHub release, which a phone can download
  # directly (an Actions artifact comes zipped and needs a GitHub login).
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: AndroidTTS-apk
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/AndroidTTS-${GITHUB_RUN_NUMBER}.apk" \
            --repo "$GITHUB_REPOSITORY" --title "AndroidTTS $GITHUB_REF_NAME" --generate-notes

name: Android

on:
  push:
  pull_request:
  # Run by hand from the Actions tab. With a tag, it also publishes the build as that release.
  workflow_dispatch:
    inputs:
      release:
        description: Publish this build as a release with this new tag, such as v0.2.0. Leave empty to only build.
        required: false
        default: ''
        type: string
  # A release published on GitHub, whose tag it creates, gets the APK attached (see "release").
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin:
    name: Kotlin and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android platform 36
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" > /dev/null'
      - name: Compile and run the unit tests
        run: ./gradlew --no-daemon --console=plain testDebugUnitTest compileDebugAndroidTestKotlin

  native:
    name: libptts_ffi.so
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Fetch xn-ptts at the pinned commit
        run: scripts/build-native.sh --fetch-only
      - name: Install Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: build/xn-ptts -> target
      - name: Install cargo-ndk
        run: command -v cargo-ndk || cargo install cargo-ndk --locked
      - name: Build
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          scripts/build-native.sh
      - uses: actions/upload-artifact@v7
        with:
          name: jniLibs
          path: app/src/main/jniLibs
          if-no-files-found: error
          retention-days: 7

  apk:
    name: APK
    needs: [kotlin, native]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android platform 36
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" > /dev/null'
      - uses: actions/download-artifact@v8
        with:
          name: jniLibs
          path: app/src/main/jniLibs
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROIDTTS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROIDTTS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROIDTTS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROIDTTS_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROIDTTS_KEYSTORE_BASE64 secret: the release APK is signed with this run's throwaway debug key, so it will not install over an APK from another run. See README.md, Signing."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "ANDROIDTTS_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "ANDROIDTTS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROIDTTS_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROIDTTS_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build the APKs
        run: |
          ./gradlew --no-daemon --console=plain assembleRelease assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/AndroidTTS-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/AndroidTTS-${GITHUB_RUN_NUMBER}-debug.apk"
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: AndroidTTS-apk
          path: dist/*.apk
          if-no-files-found: error

  # Attaches the APK to the release of a v* tag, which a phone can download directly (an Actions
  # artifact comes zipped and needs a GitHub login). Publishing a release on GitHub creates the tag
  # and the release; pushing a tag creates the release here. Both may run for one tag, so the
  # asset has a fixed name and the second upload replaces the first.
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: AndroidTTS-apk
          path: dist
      - name: Attach the APK
        env:
          GH_TOKEN: ${{ github.token }}
          # The typed-in tag for a manual run, else the tag this run is for. Passed as a variable,
          # never pasted into the script, so whatever is typed stays text.
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::A release tag looks like v1.2.3 or v1.2.3-beta.1, not '$TAG'."
            exit 1
          fi
          apk="AndroidTTS-$TAG.apk"
          cp "dist/AndroidTTS-${GITHUB_RUN_NUMBER}.apk" "$apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$apk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            # A new tag is created on the commit this run built. (Releases made with this run's
            # token start no further workflow runs, so this does not run twice.)
            gh release create "$TAG" "$apk" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "AndroidTTS $TAG" --generate-notes
          fi
